name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilar e testar
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore PrimePC.slnx

      - name: Compilar
        run: dotnet build PrimePC.slnx -c Release --no-restore

      - name: Testar
        run: dotnet test tests/PrimePC.Tests -c Release --no-build
